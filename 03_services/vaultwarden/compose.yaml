services:
  vaultwarden:
    image: vaultwarden/server:latest
    container_name: vaultwarden
    restart: always
    env_file:
      - stack.env
    environment:
      DOMAIN: "https://vaultwarden.lan.arpa"
      SIGNUPS_ALLOWED: "true"
      ADMIN_TOKEN: ${ADMIN_TOKEN}
      LOG_LEVEL: info
      WEBSOCKET_ENABLED: "true"
    volumes:
      - /volume1/docker/vaultwarden/data:/data
    ports:
      - 8222:80